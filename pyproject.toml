[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ldapdomaindump"
version = "0.12.0"
description = "Active Directory information dumper via LDAP (patched: streaming/low-memory + parallel collection)"
authors = [
  { name = "Dirk-jan Mollema", email = "dirkjan@dirkjanm.io" }
]
urls = { "Homepage" = "https://github.com/dirkjanm/ldapdomaindump/" }
requires-python = ">=3.6"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
  "dnspython",
  "ldap3>=2.5,!=2.5.2,!=2.5.0,!=2.6"
]

[tool.setuptools.packages.find]
include = ["ldapdomaindump"]

[tool.setuptools.package-data]
ldapdomaindump = ["style.css"]

[project.scripts]
# `ldapdomaindump` now dispatches to the streaming/parallel collector
# (ldd_stream.py) - parity with the upstream implementation (byte-identical
# JSON/BloodHound CSV output) was proven against a real lab domain first, see
# HANDOFF.md §0ter/§0quater. ldd_stream's CLI is a strict superset of
# upstream's (every original flag still does the same thing; --paged-size/
# --sequential/--shard-usn/--dc/--resolve-threads/--no-grouped are new), so
# no existing invocation of `ldapdomaindump` changes behavior or breaks.
# ldapdomaindump-original is kept as an explicit escape hatch to the
# untouched upstream implementation (ldapdomaindump/__init__.py, still
# byte-for-byte unmodified) if it's ever needed for comparison/troubleshooting.
ldapdomaindump = "ldapdomaindump.ldd_stream:main"
ldapdomaindump-original = "ldapdomaindump:main"
ldd2bloodhound = "ldapdomaindump.convert:ldd2bloodhound"
ldd2pretty = "ldapdomaindump.pretty:main"
ldd-stream = "ldapdomaindump.ldd_stream:main"
ldapdomaindump-stream = "ldapdomaindump.ldd_stream:main"
